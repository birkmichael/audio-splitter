<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus Splitter</title>
<style>
  :root { color-scheme: light dark; --fg:#1b1b1f; --bg:#f6f6f8; --card:#fff; --accent:#4f46e5; --muted:#6b7280; --line:#d9d9e0; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ececf1; --bg:#14141a; --card:#1e1e27; --muted:#9a9aa8; --line:#33333f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; padding:2rem 1rem 4rem; }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  p.sub { margin:0 0 1.5rem; color:var(--muted); }
  #drop { display:block; background:var(--card); border:2px dashed var(--line); border-radius:12px; padding:2.5rem 1rem; text-align:center; cursor:pointer; transition:border-color .15s; }
  #drop.over, #drop:hover, #drop:focus-within { border-color:var(--accent); }
  #drop input { position:absolute; opacity:0; width:1px; height:1px; }
  #status { margin:1.25rem 0 .5rem; min-height:1.5em; }
  progress { width:100%; height:.7rem; accent-color:var(--accent); }
  progress[hidden] { display:none; }
  ol { list-style:none; padding:0; margin:1rem 0; }
  li { display:flex; justify-content:space-between; align-items:center; gap:1rem; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.6rem .9rem; margin-bottom:.5rem; }
  li small { color:var(--muted); }
  a.btn, button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.5rem 1rem; font:inherit; text-decoration:none; cursor:pointer; }
  #all[hidden] { display:none; }
  .err { color:#dc2626; }
  footer { margin-top:2rem; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Opus Splitter</h1>
  <p class="sub">Drop in any audio file. Get back numbered Opus files at 32&nbsp;kbps, each under 48&nbsp;MB. Everything runs in your browser; nothing is uploaded.</p>

  <label id="drop">
    <input id="file" type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.flac,.ogg,.opus,.aac,.wma,.mp4,.mkv,.webm">
    <strong>Choose an audio file</strong> or drop it here
  </label>

  <div id="status" role="status" aria-live="polite"></div>
  <progress id="bar" max="1" value="0" hidden></progress>
  <ol id="out"></ol>
  <button id="all" hidden>Download all</button>

  <footer>Powered by <a href="https://ffmpegwasm.netlify.app/">ffmpeg.wasm</a> (libopus). Parts are cut at fixed time intervals, so a cut may fall mid-word.</footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
